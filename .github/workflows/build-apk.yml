
name: Build NEXUS RADIUS APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate project files
        run: |
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle << NEXUS_EOF 
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name =  NEXUS RADIUS 
          include  :app 
          NEXUS_EOF
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle << NEXUS_EOF 
          plugins {
              id  com.android.application  version  8.6.1  apply false
          }
          NEXUS_EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties << NEXUS_EOF 
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          NEXUS_EOF
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle << NEXUS_EOF 
          plugins {
              id  com.android.application 
          }

          android {
              namespace  com.nexus.radius 
              compileSdk 35
              defaultConfig {
                  applicationId  com.nexus.radius 
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName  1.0 
              }
          }
          NEXUS_EOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml << NEXUS_EOF 
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="NEXUS RADIUS" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          NEXUS_EOF
          mkdir -p "$(dirname app/src/main/java/com/nexus/radius/MainActivity.java)"
          cat > app/src/main/java/com/nexus/radius/MainActivity.java << NEXUS_EOF 
          package com.nexus.radius;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            static final String URL = "http://192.168.192.192/radiusmanager/admin.php";
            WebView w;

            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setBuiltInZoomControls(true);
              s.setDisplayZoomControls(false);
              s.setUseWideViewPort(true);
              s.setLoadWithOverviewMode(true);
              w.setWebViewClient(new WebViewClient() {
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    String html = "<html dir= rtl ><head><meta charset= utf-8 ><meta name= viewport  content= width=device-width, initial-scale=1 ></head>"
                      + "<body style= background:#080f20;color:#edf5ff;font-family:sans-serif;padding:24px >"
                      + "<h2>تعذر الاتصال بالسيرفر</h2>"
                      + "<p>تأكد أن الجوال على نفس شبكة السيرفر وأن العنوان صحيح:</p>"
                      + "<p dir= ltr >" + URL + "</p>"
                      + "<p><a style= color:#66d8ff;font-size:20px  href= " + URL + " >إعادة المحاولة</a></p></body></html>";
                    v.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                  }
                }
              });
              setContentView(w);
              if (b != null) w.restoreState(b); else w.loadUrl(URL);
            }

            @Override protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              w.saveState(out);
            }

            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          NEXUS_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  17 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version:  8.9 
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-RADIUS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
